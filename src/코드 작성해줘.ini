CollectionExplorer

에서 apiClient를 통해 사용되는 서버 엔드포인트와 사용되지 않는 요소들을 분석해보겠습니다.

분석 결과: CollectionExplorer에서 사용되는 API vs 사용되지 않는 서버 요소들
✅ CollectionExplorer에서 실제 사용되는 API (3개):
apiClient.getDatabasesSummary() → /api/databases/summary
apiClient.getCollectionSummary() → /api/databases/:dbName/collections/:collectionName/summary
apiClient.getDocument() → /api/databases/:dbName/collections/:collectionName/documents/:documentId
❌ CollectionExplorer에서 사용되지 않는 server.js 요소들:

1. REST API 엔드포인트들 (8개):
  // 사용 안됨
  app.get('/api/databases')                                          // 일반 DB 목록
  app.get('/api/databases/:dbName/collections/:collectionName')      // 컬렉션 정보
  app.get('/api/databases/:dbName/collections/:collectionName/documents') // 문서 목록
  app.post('/api/databases/:dbName/collections/:collectionName/query')    // 복잡한 쿼리
  app.post('/api/databases/:dbName/collections/:collectionName/documents') // 문서 삽입
  app.put('/api/databases/:dbName/collections/:collectionName/documents/:id') // 문서 업데이트
  app.delete('/api/databases/:dbName/collections/:collectionName/documents/:id') // 문서 삭제
  app.post('/api/databases/:dbName/collections/:collectionName/aggregate')    // 집계 파이프라인

2. WebSocket/Socket.IO 실시간 기능들 (전체):
  // 전체 실시간 기능 사용 안됨
  const io = new Server(server, { cors: {...} });
  const connectedClients = new Map();
  const activeChangeStreams = new Map();
  const clientSubscriptions = new Map();

  // WebSocket 이벤트 핸들러들
  io.on('connection', handleConnection);
  socket.on('subscribe', handleSubscribe(socket));
  socket.on('unsubscribe', handleUnsubscribe(socket));
  socket.on('disconnect', handleDisconnect);

3. MongoDB ChangeStream 관련 (전체):
  // ChangeStream 관련 모든 기능 사용 안됨
  function createChangeStream(dbName, collectionName)
  function handleCollectionChange(collectionKey, change)
  function closeChangeStream(collectionKey)
  function findDeepestPaths(updatedFields)

4. 복잡한 쿼리 처리 함수들:
  // 사용 안됨
  async function executeQuery(dbName, collectionName, options)
  function parseQueryWithObjectId(queryString)
  function convertStringToObjectId(obj)

📊 사용률 통계:
사용되는 엔드포인트: 3개 (25%)
사용되지 않는 엔드포인트: 9개 (75%)
실시간 기능: 0% 사용 (WebSocket, ChangeStream 전체 미사용)
