💡 결론:
CollectionExplorer는 읽기 전용 탐색 도구로, 서버의 75%에 해당하는 기능을 사용하지 않습니다. 특히 실시간 기능과 CRUD 작업은 전혀 사용되지 않아 상당한 최적화 여지가 있습니다.